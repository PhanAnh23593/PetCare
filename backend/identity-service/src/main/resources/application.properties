spring.application.name=identity-service
spring.config.import=optional:file:.env[.properties]
server.port=${IDENTITY_PORT:8081}
server.address=${IDENTITY_BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${IDENTITY_DB_URL:jdbc:mysql://localhost:3307/identity_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${IDENTITY_DB_USERNAME:comemyway}
spring.datasource.password=${IDENTITY_DB_PASSWORD:local-development-password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
springdoc.paths-to-match=/api/v1/**
jwt.secret=${JWT_SECRET}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:1800000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}
security.swagger-endpoints=/swagger-ui/**,/v3/api-docs/**,/swagger-ui.html
security.public-endpoints=/api/v1/auth/**,/api/v1/public/**
security.user-endpoints=/api/v1/user/**
security.clinic-endpoints=/api/v1/clinic/**
security.admin-endpoints=/api/v1/admin/**
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}
spring.data.redis.repositories.enabled=false
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
internal.clinic.token=${CLINIC_INTERNAL_TOKEN}
internal.social.token=${SOCIAL_INTERNAL_TOKEN}
springdoc.swagger-ui.urls[0].name=Identity
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Clinic
springdoc.swagger-ui.urls[1].url=/v3/api-docs/clinic
springdoc.swagger-ui.urls[2].name=Social
springdoc.swagger-ui.urls[2].url=/v3/api-docs/social
media.service.url=${MEDIA_SERVICE_URL:http://127.0.0.1:8082}
media.internal.token=${MEDIA_INTERNAL_TOKEN}
spring.cloud.openfeign.client.config.media-service.connectTimeout=5000
spring.cloud.openfeign.client.config.media-service.readTimeout=120000
