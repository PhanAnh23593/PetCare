spring.application.name=api-gateway
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
platform.service.url=${IDENTITY_SERVICE_URL:http://127.0.0.1:8081}
clinic.service.url=${CLINIC_SERVICE_URL:http://127.0.0.1:8083}
social.service.url=${SOCIAL_SERVICE_URL:http://127.0.0.1:8084}
# The platform owns multipart parsing and its original 20 MB limits.
spring.servlet.multipart.enabled=false
# Preserve the original rate-limit key; do not append the gateway address.
spring.cloud.gateway.server.webmvc.x-forwarded.for-enabled=false
spring.cloud.gateway.server.webmvc.x-forwarded.host-enabled=false
spring.cloud.gateway.server.webmvc.x-forwarded.port-enabled=false
spring.cloud.gateway.server.webmvc.x-forwarded.proto-enabled=false
spring.cloud.gateway.server.webmvc.x-forwarded.prefix-enabled=false