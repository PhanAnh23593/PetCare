spring.application.name=clinic-service
spring.config.import=optional:file:.env[.properties]
server.port=${CLINIC_PORT:8083}
server.address=${CLINIC_BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${CLINIC_DB_URL:jdbc:mysql://localhost:3308/clinic_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${CLINIC_DB_USERNAME:comemyway}
spring.datasource.password=${CLINIC_DB_PASSWORD:local-development-password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
springdoc.paths-to-match=/api/v1/**
identity.service.url=${IDENTITY_SERVICE_URL:http://127.0.0.1:8081}
identity.internal.token=${CLINIC_INTERNAL_TOKEN}
media.service.url=${MEDIA_SERVICE_URL:http://127.0.0.1:8082}
media.internal.token=${MEDIA_INTERNAL_TOKEN}
spring.cloud.openfeign.client.config.media-service.connectTimeout=5000
spring.cloud.openfeign.client.config.media-service.readTimeout=120000
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1/models/gemini-3.5-flash-lite:generateContent
springdoc.group-configs[0].group=clinic
springdoc.group-configs[0].paths-to-match=/api/v1/**
server.forward-headers-strategy=framework