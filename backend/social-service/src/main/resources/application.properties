spring.application.name=social-service
spring.config.import=optional:file:.env[.properties]
server.port=${SOCIAL_PORT:8084}
server.address=${SOCIAL_BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${SOCIAL_DB_URL:jdbc:mysql://localhost:3309/social_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SOCIAL_DB_USERNAME:comemyway}
spring.datasource.password=${SOCIAL_DB_PASSWORD:local-development-password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
springdoc.paths-to-match=/api/v1/**
identity.service.url=${IDENTITY_SERVICE_URL:http://127.0.0.1:8081}
identity.internal.token=${SOCIAL_INTERNAL_TOKEN}
springdoc.group-configs[0].group=social
springdoc.group-configs[0].paths-to-match=/api/v1/**
